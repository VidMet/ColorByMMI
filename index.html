<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>MMI Fargekoder v1.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg: #f3f4f6; --surface: #ffffff; --surface2: #e5e7eb; --border: #d1d5db; 
      --ink: #111827; --muted: #6b7280; --blue: #1d4ed8; --blue-dim: #dbeafe;
      --green: #166534; --green-dim: #dcfce7; --yellow: #ca8a04; --yellow-dim: #fef08a;
      --red: #dc2626; --red-dim: #fee2e2;
      
      /* Statusfarger for prikken i headeren */
      --ok:        #22a06b;
      --warn:      #f79009;
      --bad:       #d92d20;
      
      --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); height: 100%; display: flex; flex-direction: column; overflow: hidden; min-width: 380px; }

    /* --- NY HEADER STYLING --- */
    .topbar {
      height: 92px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 18px; padding: 10px 18px; flex: 0 0 auto;
    }
    .logo-card {
      width: 145px; height: 68px; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(16,24,40,.08); overflow: hidden; flex-shrink: 0;
    }
    .logo-card img { max-width: 128px; max-height: 50px; object-fit: contain; }
    
    .app-title { display: flex; flex-direction: column; line-height: 1.2; }
    .app-title b { font-size: 18px; color: #0050b5; }
    .app-title span { font-size: 14px; font-weight: 600; }
    .app-title em { font-size: 12px; color: #667085; font-style: normal; }
    
    .status { margin-left: auto; display: flex; align-items: center; gap: 7px; color: #667085; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; flex-shrink: 0; }
    .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.error { background: var(--bad); }

    /* Toolbar styling */
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .toolbar select, .toolbar input, .btn { font-family: var(--sans); font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    
    /* Knapper */
    .btn { font-weight: 600; background: var(--surface2); transition: background 0.2s; border: 1px solid var(--border); color: var(--ink); }
    .btn:hover:not(:disabled) { background: var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: white; border: none; }
    .btn-primary:hover:not(:disabled) { background: #1e40af; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
    .btn-outline:hover:not(:disabled) { background: var(--surface2); }
    .btn-colorize { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .btn-colorize:hover:not(:disabled) { background: #bbf7d0; }

    /* Hovedområde */
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* Paneler og lister */
    .kategori-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
    .kategori-header { background: var(--surface2); padding: 10px 14px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .kategori-body { display: flex; flex-direction: column; }
    
    .punkt-container { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; background: var(--surface); }
    .punkt-tekst-tittel { font-size: 13px; font-weight: 600; color: var(--ink); }
    .mmi-count { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: 8px; }

    /* Fargevelger input-tilpasning */
    input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; padding: 0; background: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 4px; }

    /* Div states */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .anim { animation: fadeUp .3s ease both; }

    /* Responsiv header */
    @media(max-width:760px) {
      .topbar { height: auto; padding: 8px; flex-wrap: wrap; }
      .logo-card { width: 120px; height: 58px; }
      .app-title b { font-size: 15px; }
      .app-title span { font-size: 12px; }
      .app-title em { display: none; }
    }
  </style>
</head>
<body>

<!-- NY HEADER STRUKTUR -->
<header class="topbar">
  <div class="logo-card">
    <img src="norconsult-logo-black.png" alt="Norconsult">
  </div>
  <div class="app-title">
    <b>MMI Fargekoder v1.0</b>
    <span>Norconsult Norge</span>
    <em>Developed by Norconsult, AI-assisted development. Kontaktperson: Vidar.Metveit@norconsult.com</em>
  </div>
  <div class="status">
    <span id="statusText">Starter…</span>
    <span id="statusDot" class="dot"></span>
  </div>
</header>

<div class="toolbar">
  <button class="btn btn-outline" id="btnLoad" disabled>📦 Hent modeller</button>
  <div style="border-left: 1px solid var(--border); height: 24px; margin: 0 5px;"></div>
  
  <select id="modelSelect" disabled style="font-weight: 600; color: var(--blue); min-width: 200px;">
    <option value="">– Laster... –</option>
  </select>
  
  <div style="border-left: 1px solid var(--border); height: 24px; margin: 0 5px;"></div>
  
  <button class="btn btn-primary" id="btnScan" disabled>🔍 Skann MMI i modell</button>
  <button class="btn btn-colorize" id="btnColorize" disabled>🎨 Fargelegg objekter</button>
  <button class="btn" id="btnUncolor" disabled>⬜ Nullstill farger</button>
</div>

<main id="mainContent">
  <div class="empty anim">Hent modeller, velg en modell (eller alle) fra verktøylinjen, og trykk <strong>Skann MMI</strong>.</div>
</main>

<script>
let API = null;
let allModels = [];
let mmiDataMap = new Map(); 

const $ = id => document.getElementById(id);

// Oppdatert statusfunksjon for å styre elementene i den nye headeren
const setStatus = (m, c='') => { 
    $('statusText').textContent = m; 
    let dotClass = 'dot';
    if (c === 'ok') dotClass = 'dot live';
    else if (c === 'error') dotClass = 'dot error';
    else if (c === 'warn') dotClass = 'dot warn';
    $('statusDot').className = dotClass; 
};

const lastPathPart = (v) => (v || '').split('/').pop().split('\\').pop();
const esc = (v) => (v ?? '').toString().replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));

const defaultColors = {
    "100": "#cccccc", 
    "200": "#58a6ff", 
    "300": "#ca8a04", 
    "400": "#166534", 
    "500": "#a371f7"  
};

function hexToRgba(hex) {
    let c;
    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
        c= hex.substring(1).split('');
        if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
        c= '0x'+c.join('');
        return { r: (c>>16)&255, g: (c>>8)&255, b: c&255, a: 255 };
    }
    return { r: 128, g: 128, b: 128, a: 255 }; 
}

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    $('btnLoad').disabled = false;
    $('btnScan').disabled = false;
    setStatus('Klar for bruk', 'ok');
  } catch(e) { 
      setStatus('Feil ved tilkobling til API', 'error'); 
  }
}

async function loadModels(){
  if (!API) return;
  setStatus('Leser modeller...', 'warn');
  try {
    const nameMap = new Map();
    const srcs = [() => API.models?.getModels(), () => API.viewer?.getModels()];
    for (const src of srcs) {
      try {
        const res = await src();
        const list = Array.isArray(res) ? res : (res?.models || res?.items || []);
        list.forEach(m => {
          const id = m.id || m.modelId;
          const fn = [m.name, m.fileName, m.filename].find(v => v && typeof v === 'string' && /\.(ifc|trb|dwg|rvt|skp|tekla|dxf)/i.test(v)) 
                     || [m.name, m.fileName, m.filename].find(v => v && typeof v === 'string');
          if (id && fn) nameMap.set(id, lastPathPart(fn));
        });
      } catch(e){}
    }

    const objs = await API.viewer.getObjects();
    allModels = (objs || []).map(m => {
      const mid = m.modelId || m.modelid;
      return {
        id: mid,
        name: nameMap.get(mid) || m.name || 'Ukjent modell',
        objectIds: (m.objects || []).map(o => o.id || o.objectRuntimeId).filter(id => id != null)
      };
    }).filter(m => m.objectIds.length > 0);

    let optionsHtml = `<option value="ALL">-- Alle modeller i visningen --</option>`;
    optionsHtml += allModels.map(m => `<option value="${m.id}">${esc(m.name)} (${m.objectIds.length} obj)</option>`).join('');
    
    $('modelSelect').innerHTML = optionsHtml;
    $('modelSelect').disabled = false;
    setStatus(`Hentet ${allModels.length} modeller`, 'ok');
  } catch(e) { setStatus('Feil ved henting', 'error'); }
}

async function scanMmi(){
  const selectedMid = $('modelSelect').value;
  if (!selectedMid || !API) return;
  
  setStatus('Skanner etter MMI-verdier...', 'warn');
  $('btnColorize').disabled = true; 
  $('btnUncolor').disabled = true;
  mmiDataMap.clear();
  
  try {
    const modelsToScan = selectedMid === 'ALL' ? allModels : allModels.filter(m => m.id === selectedMid);
    let objCount = 0;

    for (const model of modelsToScan) {
        const CHUNK = 200; 

        for (let i = 0; i < model.objectIds.length; i += CHUNK) {
          const propsArr = await API.viewer.getObjectProperties(model.id, model.objectIds.slice(i, i + CHUNK));
          
          propsArr.forEach(o => {
            const flat = {};
            (o.properties || []).forEach(g => (g.properties || []).forEach(p => flat[p.name] = p.value));
            
            let mmiValue = flat["MMI"];
            if (mmiValue !== undefined && mmiValue !== null && mmiValue.toString().trim() !== "") {
                mmiValue = mmiValue.toString().trim();
                
                if (!mmiDataMap.has(mmiValue)) {
                    mmiDataMap.set(mmiValue, {
                        color: defaultColors[mmiValue] || "#ff00ff",
                        objects: [] 
                    });
                }
                
                const rid = Number(o.id || o.objectRuntimeId);
                if (!isNaN(rid)) {
                    mmiDataMap.get(mmiValue).objects.push({ mid: model.id, rid: rid });
                    objCount++;
                }
            }
          });
        }
    }

    renderUi();
    setStatus(`Skann fullført (${mmiDataMap.size} verdier funnet)`, 'ok');
    $('btnColorize').disabled = false;
    $('btnUncolor').disabled = false;
  } catch(e) { 
      setStatus('Feil under skanning', 'error'); 
      console.error(e); 
  }
}

function renderUi() {
    if (mmiDataMap.size === 0) {
        $('mainContent').innerHTML = '<div class="empty anim">Fant ingen MMI-verdier i egenskapene.</div>';
        return;
    }

    const sortedKeys = Array.from(mmiDataMap.keys()).sort();
    
    let html = `
    <div class="kategori-panel anim">
        <div class="kategori-header">
            <span>▼ Funnet MMI Verdier</span>
            <span style="font-family:var(--mono); color:var(--muted); font-size:11px;">${sortedKeys.length} verdier</span>
        </div>
        <div class="kategori-body">
    `;

    sortedKeys.forEach(mmi => {
        const data = mmiDataMap.get(mmi);
        html += `
        <div class="punkt-container">
            <div>
                <span class="punkt-tekst-tittel">MMI ${esc(mmi)}</span>
                <span class="mmi-count">(${data.objects.length} objekter)</span>
            </div>
            <input type="color" data-mmi="${esc(mmi)}" value="${data.color}" onchange="updateColor(this)" title="Endre farge for MMI ${esc(mmi)}">
        </div>`;
    });

    html += `</div></div>`;
    $('mainContent').innerHTML = html;
}

window.updateColor = function(inputElement) {
    const mmi = inputElement.getAttribute('data-mmi');
    if (mmiDataMap.has(mmi)) {
        mmiDataMap.get(mmi).color = inputElement.value;
    }
};

async function colorizeModel(){
  if (!API || mmiDataMap.size === 0) return;
  setStatus('Fargelegger objekter...', 'warn');
  $('btnColorize').disabled = true;

  try {
    try { await API.viewer.setObjectState(undefined, { color: 'reset' }); } catch(e){}

    for (const [mmi, data] of mmiDataMap.entries()) {
        if (data.objects.length === 0) continue;

        const modelMap = new Map();
        for (const obj of data.objects) {
            if (!modelMap.has(obj.mid)) modelMap.set(obj.mid, []);
            modelMap.get(obj.mid).push(obj.rid);
        }

        const selection = Array.from(modelMap.entries()).map(([modelId, objectRuntimeIds]) => ({ modelId, objectRuntimeIds }));
        const rgbaColor = hexToRgba(data.color);
        
        await API.viewer.setObjectState(
            { modelObjectIds: selection }, 
            { color: rgbaColor }
        );
    }

    setStatus('Objekter fargelagt', 'ok');
    $('btnColorize').disabled = false;
  } catch (e) { 
      setStatus('Feil ved fargelegging', 'error'); 
      $('btnColorize').disabled = false;
  }
}

async function removeColors(){
  if (!API) return;
  try {
    if (API.viewer.setObjectState) {
        await API.viewer.setObjectState(undefined, { color: 'reset' });
    }
    setStatus('Farger nullstilt', 'ok');
  } catch (e) {
    setStatus('Feil ved nullstilling', 'error');
  }
}

$('btnLoad').onclick = loadModels;
$('btnScan').onclick = scanMmi;
$('btnColorize').onclick = colorizeModel;
$('btnUncolor').onclick = removeColors;

connect();
</script>
</body>
</html>

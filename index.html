<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>MMI Fargekoder v1.02</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1f2937;
      --border:    #30363d;
      --ink:       #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a3a22;
      --blue:      #58a6ff;
      --blue-dim:  #0d2044;
      --red:       #f85149;
      --red-dim:   #3a1212;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); }
    .header-title p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
    .badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }

    .btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity .15s, transform .1s; white-space: nowrap; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-ghost   { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    .btn-colorize { background: #1a3a22; color: var(--green); border: 1px solid #2a5a32; }
    .btn-unreset  { background: #1f2937; color: var(--muted); border: 1px solid var(--border); }

    #statusBar { font-family: var(--mono); font-size: 11px; padding: 6px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid #1a3a5c; flex-shrink: 0; }
    #statusBar.ok    { background: var(--green-dim); color: var(--green); border-color: #1a3a22; }
    #statusBar.error { background: var(--red-dim);   color: var(--red);   border-color: #3a1212; }

    #modelBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; }
    .select-group { display: flex; align-items: center; gap: 8px; flex: 1; }
    #modelBar label { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
    select { font-family: var(--mono); font-size: 12px; background: var(--surface2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 100%; min-width: 0; }
    select:disabled { opacity: .4; }

    main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .panel-header h3 { font-size: 13px; font-weight: 700; flex: 1; }
    
    .mmi-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .mmi-row:last-child { border-bottom: none; }
    .mmi-label { font-size: 13px; font-weight: 600; }
    .mmi-count { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: 8px; }
    
    input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; padding: 0; background: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 4px; }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .anim { animation: fadeUp .3s ease both; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>MMI Fargekoder v1.02</h1>
    <p>Dynamisk fargelegging basert på MMI</p>
  </div>
  <span class="badge" id="modelBadge">Frakoblet</span>
  <button class="btn btn-ghost" id="btnLoad" disabled>Hent modeller</button>
  <button class="btn btn-primary" id="btnScan" disabled>▶ Skann MMI</button>
  <button class="btn btn-colorize" id="btnColorize" disabled>🎨 Fargelegg</button>
  <button class="btn btn-unreset" id="btnUncolor" disabled>⬜ Nullstill Farger</button>
</header>

<div id="statusBar">Kobler til Trimble Connect...</div>

<div id="modelBar">
  <div class="select-group">
    <label>Modell:</label>
    <select id="modelSelect" disabled><option value="">– Laster... –</option></select>
  </div>
</div>

<main id="mainContent">
  <div class="empty anim">Hent modeller, velg en modell (eller alle) fra menyen og trykk <strong>Skann MMI</strong>.</div>
</main>

<script>
let API = null;
let allModels = [];
let mmiDataMap = new Map(); 

const $ = id => document.getElementById(id);
const setStatus = (m, c='') => { $('statusBar').textContent = m; $('statusBar').className = c; };
const lastPathPart = (v) => (v || '').split('/').pop().split('\\').pop(); // Henter filnavn riktig
const esc = (v) => (v ?? '').toString().replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));

const defaultColors = {
    "100": "#cccccc", 
    "200": "#58a6ff", 
    "300": "#d29922", 
    "400": "#3fb950", 
    "500": "#a371f7"  
};

function hexToRgba(hex) {
    let c;
    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
        c= hex.substring(1).split('');
        if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
        c= '0x'+c.join('');
        return { r: (c>>16)&255, g: (c>>8)&255, b: c&255, a: 255 };
    }
    return { r: 128, g: 128, b: 128, a: 255 }; 
}

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    $('btnLoad').disabled = false;
    $('btnScan').disabled = false;
    setStatus('✅ Tilkoblet Trimble Connect.', 'ok');
    $('modelBadge').textContent = 'Tilkoblet';
  } catch(e) { setStatus('❌ Kunne ikke koble til API.', 'error'); }
}

async function loadModels(){
  if (!API) return;
  setStatus('⏳ Leser modeller og filnavn...');
  try {
    // Navneoppslag lagt tilbake!
    const nameMap = new Map();
    const srcs = [() => API.models?.getModels(), () => API.viewer?.getModels()];
    for (const src of srcs) {
      try {
        const res = await src();
        const list = Array.isArray(res) ? res : (res?.models || res?.items || []);
        list.forEach(m => {
          const id = m.id || m.modelId;
          const fn = [m.name, m.fileName, m.filename].find(v => /\.ifc/i.test(v));
          if (id && fn) nameMap.set(id, lastPathPart(fn));
        });
      } catch(e){}
    }

    const objs = await API.viewer.getObjects();
    allModels = (objs || []).map(m => {
      const mid = m.modelId || m.modelid;
      return {
        id: mid,
        name: nameMap.get(mid) || m.name || 'Ukjent modell',
        objectIds: (m.objects || []).map(o => o.id || o.objectRuntimeId).filter(id => id != null)
      };
    }).filter(m => m.objectIds.length > 0);

    // Legger til valget for "Alle modeller"
    let optionsHtml = `<option value="ALL">-- Alle modeller --</option>`;
    optionsHtml += allModels.map(m => `<option value="${m.id}">${esc(m.name)} (${m.objectIds.length} obj)</option>`).join('');
    
    $('modelSelect').innerHTML = optionsHtml;
    $('modelSelect').disabled = false;
    setStatus('✅ Modeller hentet.', 'ok');
  } catch(e) { setStatus('❌ Feil ved henting: ' + e.message, 'error'); }
}

async function scanMmi(){
  const selectedMid = $('modelSelect').value;
  if (!selectedMid || !API) return;
  
  setStatus('⏳ Skanner objekter for MMI-verdier...');
  $('btnColorize').disabled = true; 
  $('btnUncolor').disabled = true;
  mmiDataMap.clear();
  
  try {
    // Sjekker om vi skal skanne alle eller bare én valgt
    const modelsToScan = selectedMid === 'ALL' ? allModels : allModels.filter(m => m.id === selectedMid);
    let objCount = 0;

    for (const model of modelsToScan) {
        const CHUNK = 200; 

        for (let i = 0; i < model.objectIds.length; i += CHUNK) {
          const propsArr = await API.viewer.getObjectProperties(model.id, model.objectIds.slice(i, i + CHUNK));
          
          propsArr.forEach(o => {
            const flat = {};
            (o.properties || []).forEach(g => (g.properties || []).forEach(p => flat[p.name] = p.value));
            
            let mmiValue = flat["MMI"];
            if (mmiValue !== undefined && mmiValue !== null && mmiValue.toString().trim() !== "") {
                mmiValue = mmiValue.toString().trim();
                
                if (!mmiDataMap.has(mmiValue)) {
                    mmiDataMap.set(mmiValue, {
                        color: defaultColors[mmiValue] || "#ff00ff",
                        objects: [] // Lagrer nå både modell-ID og objekt-ID
                    });
                }
                
                // Konverterer til Number (Dette løser fargeleggings-feilen!)
                const rid = Number(o.id || o.objectRuntimeId);
                if (!isNaN(rid)) {
                    mmiDataMap.get(mmiValue).objects.push({ mid: model.id, rid: rid });
                    objCount++;
                }
            }
          });
          setStatus(`⏳ Skanner ${esc(model.name)}... ${Math.min(i+CHUNK, model.objectIds.length)} / ${model.objectIds.length}`);
        }
    }

    renderUi();
    setStatus(`✅ Fant ${mmiDataMap.size} ulike MMI-verdier på tvers av ${objCount} objekter.`, 'ok');
    $('btnColorize').disabled = false;
    $('btnUncolor').disabled = false;
  } catch(e) { 
      setStatus('❌ Feil: ' + e.message, 'error'); 
      console.error(e); 
  }
}

function renderUi() {
    if (mmiDataMap.size === 0) {
        $('mainContent').innerHTML = '<div class="empty anim">Fant ingen MMI-verdier.</div>';
        return;
    }

    const sortedKeys = Array.from(mmiDataMap.keys()).sort();
    let html = `<div class="panel anim"><div class="panel-header"><h3>MMI Verdier og Farger</h3></div><div id="mmiList">`;

    sortedKeys.forEach(mmi => {
        const data = mmiDataMap.get(mmi);
        html += `
        <div class="mmi-row">
            <div>
                <span class="mmi-label">MMI ${esc(mmi)}</span>
                <span class="mmi-count">(${data.objects.length} objekter)</span>
            </div>
            <input type="color" data-mmi="${esc(mmi)}" value="${data.color}" onchange="updateColor(this)">
        </div>`;
    });

    html += `</div></div>`;
    $('mainContent').innerHTML = html;
}

window.updateColor = function(inputElement) {
    const mmi = inputElement.getAttribute('data-mmi');
    if (mmiDataMap.has(mmi)) {
        mmiDataMap.get(mmi).color = inputElement.value;
    }
};

async function colorizeModel(){
  if (!API || mmiDataMap.size === 0) return;
  setStatus('🎨 Fargelegger MMI-verdier i modellen…');
  $('btnColorize').disabled = true;

  try {
    try { await API.viewer.setObjectState(undefined, { color: 'reset' }); } catch(e){}

    for (const [mmi, data] of mmiDataMap.entries()) {
        if (data.objects.length === 0) continue;

        // Grupperer objektene per modell-ID før vi sender dem til API-et
        const modelMap = new Map();
        for (const obj of data.objects) {
            if (!modelMap.has(obj.mid)) modelMap.set(obj.mid, []);
            modelMap.get(obj.mid).push(obj.rid);
        }

        // Oversetter til det formatet API-et forventer
        const selection = Array.from(modelMap.entries()).map(([modelId, objectRuntimeIds]) => ({ modelId, objectRuntimeIds }));
        const rgbaColor = hexToRgba(data.color);
        
        await API.viewer.setObjectState(
            { modelObjectIds: selection }, 
            { color: rgbaColor }
        );
    }

    setStatus('✅ Modell(er) fargelagt etter MMI!', 'ok');
    $('btnColorize').disabled = false;
  } catch (e) { 
      setStatus('❌ Feil ved fargelegging: ' + e.message, 'error'); 
      $('btnColorize').disabled = false;
  }
}

async function removeColors(){
  if (!API) return;
  try {
    if (API.viewer.setObjectState) {
        await API.viewer.setObjectState(undefined, { color: 'reset' });
    }
    setStatus('⬜ Modellfarger nullstilt.', '');
  } catch (e) {
    setStatus('❌ Feil ved fjerning av farger: ' + e.message, 'error');
  }
}

$('btnLoad').onclick = loadModels;
$('btnScan').onclick = scanMmi;
$('btnColorize').onclick = colorizeModel;
$('btnUncolor').onclick = removeColors;
connect();
</script>
</body>
</html>
